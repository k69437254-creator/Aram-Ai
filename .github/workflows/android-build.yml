name: Build Aram AI APK

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aram-ai-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Build ARM64 Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout Aram AI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install pinned Android native build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.13113456" "cmake;3.31.6"

      - name: Fetch official llama.cpp Android binding and native source
        run: |
          bash scripts/prepare_native.sh
          test -f vendor/llama.cpp/examples/llama.android/lib/src/main/cpp/CMakeLists.txt
          echo "llama.cpp revision: $(git -C vendor/llama.cpp rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aram-AI-ARM64-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
